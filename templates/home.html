<!DOCTYPE html>
<html>
<head>

<title>HealthGuard AI</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

<style>

body{
    margin:0;
    height:100vh;
    font-family:Poppins;
    background:linear-gradient(270deg,#020024,#090979,#00d4ff);
    background-size:600% 600%;
    animation:bgMove 15s ease infinite;
    overflow:hidden;
    color:white;
}

/* Background Animation */
@keyframes bgMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

/* Floating Circles */
.circle{
    position:absolute;
    border-radius:50%;
    background:rgba(0,255,255,0.15);
    animation:float 12s infinite linear;
}

.circle:nth-child(1){
    width:200px;
    height:200px;
    left:10%;
    top:20%;
}

.circle:nth-child(2){
    width:300px;
    height:300px;
    left:70%;
    top:10%;
    animation-delay:3s;
}

.circle:nth-child(3){
    width:150px;
    height:150px;
    left:40%;
    top:70%;
    animation-delay:6s;
}

@keyframes float{
    from{transform:translateY(0);}
    to{transform:translateY(-100vh);}
}

/* Navbar */
nav{
    padding:20px 50px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:rgba(0,0,0,0.5);
}

nav a{
    color:white;
    margin:0 15px;
    text-decoration:none;
}

nav a:hover{
    color:cyan;
}

/* Main Content */
.main{
    height:80vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    animation:fade 2s;
}

@keyframes fade{
    from{opacity:0; transform:translateY(40px);}
    to{opacity:1;}
}

h1{
    font-size:50px;
    margin-bottom:10px;
}

p{
    font-size:20px;
    max-width:600px;
}

/* Button */
.btn{
    margin-top:25px;
    padding:15px 40px;
    background:cyan;
    border:none;
    border-radius:30px;
    font-size:18px;
    cursor:pointer;
    transition:0.3s;
}

.btn:hover{
    transform:scale(1.1);
    background:#00ffaa;
    box-shadow:0 0 20px cyan;
}

</style>

</head>

<body>

<!-- Floating Background -->
<div class="circle"></div>
<div class="circle"></div>
<div class="circle"></div>


<!-- NAVBAR -->
<nav>
    <h2>💙 HealthGuard</h2>

    <div>
        <a href="/">Home</a>
        <a href="/check">Check</a>
        <a href="/about">About</a>
        <a href="/contact">Contact</a>
    </div>
</nav>


<!-- MAIN -->
<div class="main">

<h1>AI Powered Health Assistant</h1>

<p>
Analyze your health using artificial intelligence.
Fast. Secure. Reliable.
Designed for modern users.
</p>

<button class="btn" onclick="window.location.href='/check'">
🚀 Try Now
</button>

</div>

</body>
</html>
