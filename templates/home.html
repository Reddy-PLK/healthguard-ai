<!DOCTYPE html>
<html>
<head>
<title>HealthGuard AI</title>

<style>

body{
    margin:0;
    font-family:Poppins,Arial;
    background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    color:white;
}

/* Navbar */
nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 50px;
    background:rgba(0,0,0,0.5);
}

nav a{
    color:white;
    text-decoration:none;
    margin:0 15px;
    font-weight:600;
}

nav a:hover{
    color:#00fff0;
}

/* Hero */
.hero{
    height:90vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
}

.hero h1{
    font-size:50px;
    color:#00fff0;
}

.hero p{
    width:60%;
    font-size:18px;
    color:#ccc;
}

.hero button{
    margin-top:25px;
    padding:14px 30px;
    font-size:18px;
    border:none;
    background:#00fff0;
    border-radius:8px;
    cursor:pointer;
}

.hero button:hover{
    background:#00c9c3;
}

</style>
</head>

<body>

<nav>
    <h2>💙 HealthGuard AI</h2>
    <div>
        <a href="/">Home</a>
        <a href="/about">About</a>
        <a href="/contact">Contact</a>
        <a href="/check">Try Now</a>
    </div>
</nav>

<div class="hero">

    <h1>AI Health Risk Scanner</h1>

    <p>
        Check your health instantly using Artificial Intelligence.
        Simple. Fast. Reliable.
    </p>

    <a href="/check">
        <button>🚀 Try Now</button>
    </a>

</div>

</body>
</html>
