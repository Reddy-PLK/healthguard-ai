<!DOCTYPE html>
<html>
<head>
    <title>HealthGuard AI</title>
    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
            text-align: center;
            padding: 40px;
        }

        form {
            background: white;
            width: 300px;
            margin: auto;
            padding: 20px;
            border-radius: 10px;
        }

        input {
            width: 90%;
            padding: 8px;
            margin: 8px;
        }

        button {
            padding: 10px 20px;
            background: green;
            color: white;
            border: none;
            cursor: pointer;
        }

        h3 {
            color: blue;
        }
    </style>
</head>

<body>

<h1>💙 HealthGuard AI</h1>
<p>Check your basic health risk</p>

<form action="/predict" method="post">

    <input type="number" step="any" name="fever" placeholder="Fever Level" required>

    <input type="number" step="any" name="cough" placeholder="Cough Severity" required>

    <input type="number" step="any" name="fatigue" placeholder="Fatigue Level" required>

    <input type="number" step="any" name="headache" placeholder="Headache Level" required>

    <button type="submit">Check Health</button>

</form>

{% if prediction %}
<h3>{{ prediction }}</h3>
{% endif %}

</body>
</html>
