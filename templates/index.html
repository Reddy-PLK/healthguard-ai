<!DOCTYPE html>
<html>
<head>
    <title>HealthGuard AI</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
            text-align: center;
            padding: 40px;
        }

        form {
            background: white;
            width: 320px;
            margin: auto;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        input {
            width: 90%;
            padding: 8px;
            margin: 8px;
        }

        button {
            padding: 10px 25px;
            background: green;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background: darkgreen;
        }

        h3 {
            color: blue;
        }
    </style>
</head>

<body>

<h1>💙 HealthGuard AI</h1>
<p>Check your basic health risk</p>

<form method="POST">

    <input type="number" step="any" name="fever" placeholder="Fever Level" required>

    <input type="number" step="any" name="cough" placeholder="Cough Severity" required>

    <input type="number" step="any" name="fatigue" placeholder="Fatigue Level" required>

    <input type="number" step="any" name="headache" placeholder="Headache Level" required>

    <br><br>

    <button type="submit">Check Health</button>

</form>

<br>

{% if prediction %}
<h3>{{ prediction }}</h3>
{% endif %}

</body>
</html>
